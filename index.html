<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Service NSW Kiosk</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kiosk.css">
</head>
<body class="welcome-page">

  <!-- ── HEADER ── -->
  <header class="kiosk-header">
    <div class="header-left">
      <button class="btn-nav btn-home" onclick="goHome()" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
          <polyline points="9,21 9,13 15,13 15,21"/>
        </svg>
      </button>
    </div>
    <div class="header-center">
      <div class="nsw-logo-lockup">
        <img src="assets/service-nsw-logo.svg" alt="Service NSW" class="nsw-logo-img" height="36">
      </div>
    </div>
    <div class="header-right">
      <div class="search-bar">
        <input type="text" class="search-input" placeholder="Search forms…" id="welcomeSearch" onkeydown="handleWelcomeSearch(event)">
        <button class="search-btn" onclick="handleWelcomeSearch({key:'Enter'})" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ── WELCOME SCREEN ── -->
  <main class="welcome-screen" id="welcomeMain">

    <!-- Landmark SVG background illustration -->
    <div class="landmark-bg" id="landmarkBg">
      <svg class="landmark-svg" viewBox="0 0 1280 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Generic government building / landmark line art -->
        <!-- Main building body -->
        <rect x="380" y="220" width="520" height="250" fill="none" stroke="#E4002B" stroke-width="1.5" opacity="0.25"/>
        <!-- Columns -->
        <line x1="420" y1="220" x2="420" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <line x1="470" y1="220" x2="470" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <line x1="520" y1="220" x2="520" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <line x1="570" y1="220" x2="570" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <line x1="640" y1="220" x2="640" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <line x1="710" y1="220" x2="710" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <line x1="760" y1="220" x2="760" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <line x1="810" y1="220" x2="810" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <line x1="860" y1="220" x2="860" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <!-- Roof / pediment -->
        <polygon points="370,220 640,120 910,220" fill="none" stroke="#E4002B" stroke-width="1.5" opacity="0.25"/>
        <!-- Clock tower -->
        <rect x="600" y="60" width="80" height="60" fill="none" stroke="#E4002B" stroke-width="1.5" opacity="0.3"/>
        <circle cx="640" cy="90" r="18" fill="none" stroke="#E4002B" stroke-width="1.2" opacity="0.3"/>
        <line x1="640" y1="78" x2="640" y2="90" stroke="#E4002B" stroke-width="1" opacity="0.3"/>
        <line x1="640" y1="90" x2="650" y2="90" stroke="#E4002B" stroke-width="1" opacity="0.3"/>
        <rect x="625" y="30" width="30" height="30" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.25"/>
        <polygon points="625,30 640,10 655,30" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.25"/>
        <!-- Windows -->
        <rect x="430" y="260" width="30" height="40" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.18"/>
        <rect x="480" y="260" width="30" height="40" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.18"/>
        <rect x="530" y="260" width="30" height="40" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.18"/>
        <rect x="720" y="260" width="30" height="40" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.18"/>
        <rect x="770" y="260" width="30" height="40" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.18"/>
        <rect x="820" y="260" width="30" height="40" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.18"/>
        <!-- Door -->
        <rect x="610" y="370" width="60" height="100" fill="none" stroke="#E4002B" stroke-width="1.2" opacity="0.25"/>
        <!-- Side wings -->
        <rect x="160" y="300" width="220" height="170" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.15"/>
        <rect x="900" y="300" width="220" height="170" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.15"/>
        <!-- Ground line -->
        <line x1="0" y1="470" x2="1280" y2="470" stroke="#E4002B" stroke-width="1" opacity="0.1"/>
        <!-- Street lamp left -->
        <line x1="280" y1="310" x2="280" y2="470" stroke="#E4002B" stroke-width="1.2" opacity="0.2"/>
        <path d="M280 310 Q260 295 240 300" fill="none" stroke="#E4002B" stroke-width="1.2" opacity="0.2"/>
        <circle cx="237" cy="302" r="4" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <!-- Street lamp right -->
        <line x1="1000" y1="310" x2="1000" y2="470" stroke="#E4002B" stroke-width="1.2" opacity="0.2"/>
        <path d="M1000 310 Q1020 295 1040 300" fill="none" stroke="#E4002B" stroke-width="1.2" opacity="0.2"/>
        <circle cx="1043" cy="302" r="4" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.2"/>
        <!-- Cars parked -->
        <rect x="160" y="445" width="60" height="25" rx="4" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.15"/>
        <rect x="240" y="445" width="60" height="25" rx="4" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.15"/>
        <rect x="980" y="445" width="60" height="25" rx="4" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.15"/>
        <rect x="1060" y="445" width="60" height="25" rx="4" fill="none" stroke="#E4002B" stroke-width="1" opacity="0.15"/>
      </svg>
    </div>

    <div class="welcome-content">
      <p class="welcome-tagline">New South Wales Government</p>
      <h1 class="welcome-heading" id="welcomeHeading">Welcome to Service NSW</h1>

      <!-- Service NSW large logo -->
      <div class="welcome-logo-wrap">
        <img src="assets/favicon.svg" alt="Service NSW" class="welcome-logo" width="260">
      </div>

      <p class="welcome-cta">Touch anywhere or tap below to browse forms</p>
    </div>

    <!-- Swipe up / tap chevron CTA -->
    <div class="chevron-cta" id="chevronCta" onclick="goToCategories()" role="button" tabindex="0" aria-label="Tap to browse forms">
      <svg class="chevron-icon" width="56" height="48" viewBox="0 0 56 48">
        <polyline points="4,32 28,12 52,32" fill="none" stroke="#002664" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="4,44 28,24 52,44" fill="none" stroke="#002664" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
      </svg>
      <span class="chevron-label">Tap to begin</span>
    </div>

  </main>

  <script src="config.js"></script>
  <script src="js/kiosk.js"></script>
  <script>
    // Set branch name from config
    const branchName = (typeof CONFIG !== 'undefined' && CONFIG.branchName) ? CONFIG.branchName : '';
    document.getElementById('welcomeHeading').textContent =
      'Welcome to Service NSW' + (branchName ? ' ' + branchName : '');
    document.title = 'Service NSW Kiosk' + (branchName ? ' — ' + branchName : '');

    // Idle timer — reset to this page after 60s inactivity
    setupIdleTimer(
      (typeof CONFIG !== 'undefined' ? CONFIG.idleTimeoutWelcome : 60000),
      () => { /* already on welcome */ }
    );

    // Swipe up to proceed
    setupSwipeUp(goToCategories);

    // Chevron keyboard
    document.getElementById('chevronCta').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') goToCategories();
    });

    function goToCategories() {
      navigateTo('categories.html');
    }

    function handleWelcomeSearch(e) {
      if (e.key === 'Enter') {
        const q = document.getElementById('welcomeSearch').value.trim();
        if (q) navigateTo('categories.html?q=' + encodeURIComponent(q));
        else goToCategories();
      }
    }

    applyRipples();
  </script>
</body>
</html>
