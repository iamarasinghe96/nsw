<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forms — Service NSW Kiosk</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kiosk.css">
</head>
<body class="forms-page">

  <!-- ── HEADER ── -->
  <header class="kiosk-header">
    <div class="header-left">
      <button class="btn-nav btn-home" onclick="goHome()" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
          <polyline points="9,21 9,13 15,13 15,21"/>
        </svg>
      </button>
      <button class="btn-nav btn-back" onclick="goBack()" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      </button>
    </div>
    <div class="header-center">
      <div class="nsw-logo-lockup">
        <img src="assets/service-nsw-logo.svg" alt="Service NSW" class="nsw-logo-img" height="36">
      </div>
    </div>
    <div class="header-right">
      <div class="search-bar">
        <input type="text" class="search-input" placeholder="Search forms…" id="searchInput" oninput="handleSearch(this.value)" aria-label="Search forms">
        <button class="search-btn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ── MAIN CONTENT ── -->
  <main class="forms-main" id="formsMain">
    <div class="forms-header-bar">
      <h2 class="forms-category-title" id="categoryTitle">Loading…</h2>
      <span class="forms-count" id="formsCount"></span>
    </div>
    <div class="forms-grid" id="formsGrid">
      <!-- Populated by JS -->
    </div>
  </main>

  <script src="config.js"></script>
  <script src="js/kiosk.js"></script>
  <script>
    let categoryName = '';
    let allForms = [];
    let filteredForms = [];

    async function init() {
      categoryName = getParam('category') || sessionStorage.getItem('selectedCategory') || '';

      if (!categoryName) {
        document.getElementById('categoryTitle').textContent = 'Unknown Category';
        return;
      }

      document.getElementById('categoryTitle').textContent = categoryName;
      document.title = categoryName + ' — Service NSW Kiosk';

      try {
        const categoriesPath = (typeof CONFIG !== 'undefined' && CONFIG.categoriesPath)
          ? CONFIG.categoriesPath : 'data/categories.json';
        const cats = await loadJSON(categoriesPath);
        allForms = (cats[categoryName] || []);
        filteredForms = [...allForms];

        if (allForms.length === 0) {
          document.getElementById('formsGrid').innerHTML = '<p class="empty-msg">No forms available in this category.</p>';
          return;
        }

        renderForms(filteredForms);
      } catch (e) {
        document.getElementById('formsGrid').innerHTML = '<p class="error-msg">Unable to load forms. Please try again.</p>';
      }
    }

    function renderForms(forms) {
      const grid = document.getElementById('formsGrid');
      const count = document.getElementById('formsCount');
      count.textContent = `${forms.length} form${forms.length !== 1 ? 's' : ''}`;

      if (forms.length === 0) {
        grid.innerHTML = '<p class="no-results">No forms match your search.</p>';
        return;
      }

      grid.innerHTML = '';
      forms.forEach(filename => {
        const formId = filename.replace(/\.pdf$/i, '');
        const displayName = getFormDisplayName(filename);
        const catNum = getCatalogueNumber(filename);

        const card = document.createElement('div');
        card.className = 'form-card';
        card.innerHTML = `
          <div class="form-card-deco" aria-hidden="true">
            <div class="form-card-deco-waves"></div>
            <div class="form-card-deco-dots"></div>
          </div>
          <div class="form-card-body">
            <h3 class="form-card-name">${displayName}</h3>
            ${catNum ? `<p class="form-card-catalogue">Cat. ${catNum}</p>` : ''}
          </div>
          <button class="start-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="9,18 15,12 9,6"/></svg>
            Start Form
          </button>
        `;
        card.querySelector('.start-btn').addEventListener('click', () => startForm(formId));
        grid.appendChild(card);
      });

      applyRipples();
    }

    function handleSearch(query) {
      const q = normalise(query.trim());
      if (!q) {
        filteredForms = [...allForms];
      } else {
        filteredForms = allForms.filter(f =>
          normalise(getFormDisplayName(f)).includes(q) ||
          normalise(f).includes(q)
        );
      }
      renderForms(filteredForms);
    }

    function startForm(formId) {
      incrementFormAccess(formId);
      sessionStorage.setItem('selectedFormId', formId);
      navigateTo(`qr.html?id=${encodeURIComponent(formId)}`);
    }

    // Idle timer
    setupIdleTimer(
      (typeof CONFIG !== 'undefined' ? CONFIG.idleTimeoutWelcome : 60000),
      goHome
    );

    init();
  </script>
</body>
</html>
