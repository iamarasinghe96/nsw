<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scan QR Code — Service NSW Kiosk</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kiosk.css">
  <script src="js/qrcode.min.js"></script>
</head>
<body class="qr-page">

  <!-- ── HEADER ── -->
  <header class="kiosk-header">
    <div class="header-left">
      <button class="btn-nav btn-home" onclick="goHome()" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
          <polyline points="9,21 9,13 15,13 15,21"/>
        </svg>
      </button>
      <button class="btn-nav btn-back" onclick="goBack()" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      </button>
    </div>
    <div class="header-center">
      <div class="nsw-logo-lockup">
        <img src="assets/service-nsw-logo.svg" alt="Service NSW" class="nsw-logo-img" height="36">
      </div>
    </div>
    <div class="header-right">
      <!-- No search on QR screen -->
    </div>
  </header>

  <!-- ── MAIN CONTENT ── -->
  <main class="qr-main" id="qrMain">

    <div class="qr-card">

      <div class="qr-card-top">
        <h2 class="qr-form-name" id="qrFormName">Loading form…</h2>
        <p class="qr-catalogue" id="qrCatalogue"></p>
      </div>

      <div class="qr-code-wrap">
        <div class="qr-code-container" id="qrCodeContainer">
          <!-- QR rendered here by QRCode.js -->
        </div>
        <p class="qr-url-hint" id="qrUrlHint"></p>
      </div>

      <div class="qr-instructions">
        <div class="qr-step">
          <div class="qr-step-num">1</div>
          <p>Scan this QR code with your phone camera to open the form</p>
        </div>
        <div class="qr-step">
          <div class="qr-step-num">2</div>
          <p>Fill in the form on your phone, then tap <strong>Submit</strong></p>
        </div>
        <div class="qr-step">
          <div class="qr-step-num">3</div>
          <p>Show the QR code on your phone to staff at the counter</p>
        </div>
      </div>

    </div>

    <!-- Countdown / auto-reset -->
    <div class="qr-reset-bar" id="qrResetBar">
      <div class="qr-reset-progress" id="qrResetProgress"></div>
    </div>
    <p class="qr-reset-hint">This screen will reset in <span id="qrCountdown">120</span>s</p>

  </main>

  <script src="config.js"></script>
  <script src="js/kiosk.js"></script>
  <script src="js/qr-generator.js"></script>
  <script>
    const RESET_SECONDS = (typeof CONFIG !== 'undefined' ? CONFIG.idleTimeoutQR : 120000) / 1000;
    let countdownVal = RESET_SECONDS;
    let countdownInterval = null;
    let resetTimer = null;

    function startCountdown() {
      countdownVal = RESET_SECONDS;
      document.getElementById('qrCountdown').textContent = countdownVal;

      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdownVal--;
        const el = document.getElementById('qrCountdown');
        if (el) el.textContent = countdownVal;

        // Update progress bar
        const pct = (1 - countdownVal / RESET_SECONDS) * 100;
        const bar = document.getElementById('qrResetProgress');
        if (bar) bar.style.width = pct + '%';

        if (countdownVal <= 0) {
          clearInterval(countdownInterval);
          goHome();
        }
      }, 1000);
    }

    function resetCountdown() {
      countdownVal = RESET_SECONDS;
      if (document.getElementById('qrCountdown')) {
        document.getElementById('qrCountdown').textContent = countdownVal;
      }
      const bar = document.getElementById('qrResetProgress');
      if (bar) bar.style.width = '0%';
    }

    async function init() {
      const formId = getParam('id') || sessionStorage.getItem('selectedFormId') || '';

      if (!formId) {
        document.getElementById('qrFormName').textContent = 'Unknown Form';
        return;
      }

      const filename = formId + '.pdf';
      const displayName = getFormDisplayName(filename);
      const catNum = getCatalogueNumber(filename);

      document.getElementById('qrFormName').textContent = displayName;
      document.getElementById('qrCatalogue').textContent = catNum ? `Cat. ${catNum}` : '';
      document.title = displayName + ' — Service NSW Kiosk';

      // Build the URL to encode
      const formUrl = buildFormUrl(formId);
      document.getElementById('qrUrlHint').textContent = formUrl;

      // Generate QR code
      try {
        generateKioskQR('qrCodeContainer', formId);
      } catch (e) {
        // Fallback: show a simple link
        document.getElementById('qrCodeContainer').innerHTML =
          `<p style="color:#002664;font-size:12px;word-break:break-all;">${formUrl}</p>`;
      }

      startCountdown();

      // Any touch/interaction resets countdown
      const events = ['touchstart', 'touchmove', 'click', 'keydown', 'mousemove'];
      events.forEach(ev => {
        document.addEventListener(ev, resetCountdown, { passive: true });
      });
    }

    setupIdleTimer(
      (typeof CONFIG !== 'undefined' ? CONFIG.idleTimeoutQR : 120000),
      goHome
    );

    applyRipples();
    init();
  </script>
</body>
</html>
